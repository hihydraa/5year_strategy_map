<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผนที่ Highlight ภาคอีสาน</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .district-label {
      background: transparent;
      border: none;
      box-shadow: none;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      text-shadow:
        1px 1px 2px #fff,
        -1px -1px 2px #fff,
        1px -1px 2px #fff,
        -1px 1px 2px #fff;
      pointer-events: none;
    }

    .info-box {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      width: 320px;
      max-width: calc(100vw - 32px);
      background: rgba(255, 255, 255, 0.95);
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    }

    .info-box h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    .info-box p {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #444;
      line-height: 1.45;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      padding: 9px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    button {
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #374151;
      background: #f3f4f6;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <h2>พื้นที่ Highlight ภาคอีสาน</h2>
    <p>แสดงขอบเขตอำเภอในภาคอีสาน พร้อม Label ชื่ออำเภอ และค้นหาได้จากชื่ออำเภอหรือจังหวัด เช่น ยางตลาด, กาฬสินธุ์</p>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="ค้นหาอำเภอ/จังหวัด" />
      <button onclick="searchArea()">ค้นหา</button>
    </div>
    <div id="status">กำลังโหลดข้อมูล...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map', {
      zoomControl: true,
      preferCanvas: true
    }).setView([16.2, 103.2], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const defaultStyle = {
      color: '#334155',
      weight: 0.7,
      fillColor: '#f59e0b',
      fillOpacity: 0.55
    };

    const hoverStyle = {
      color: '#111827',
      weight: 2,
      fillColor: '#f97316',
      fillOpacity: 0.75
    };

    const selectedStyle = {
      color: '#1d4ed8',
      weight: 3,
      fillColor: '#2563eb',
      fillOpacity: 0.85
    };

    let geojsonLayer;
    let districtLayers = [];

    function getAmpName(properties) {
      return properties.amp_th || properties.AMPHOE_T || properties.district_th || properties.name_th || '';
    }

    function getProvinceName(properties) {
      return properties.pro_th || properties.PROVINCE_T || properties.province_th || '';
    }

    function getArea(properties) {
      return properties.area_sqkm || properties.AREA_SQKM || '';
    }

    fetch('./districts_isan.geojson')
      .then(response => {
        if (!response.ok) throw new Error('ไม่พบไฟล์ districts_isan.geojson');
        return response.json();
      })
      .then(data => {
        geojsonLayer = L.geoJSON(data, {
          style: defaultStyle,

          onEachFeature: function(feature, layer) {
            const props = feature.properties || {};
            const district = getAmpName(props);
            const province = getProvinceName(props);
            const area = getArea(props);

            districtLayers.push({
              amp: district,
              province: province,
              layer: layer
            });

            layer.bindPopup(`
              <b>อำเภอ${district}</b><br>
              จังหวัด${province}<br>
              ${area ? `พื้นที่ ${area} ตร.กม.` : ''}
            `);

            layer.bindTooltip(district, {
              permanent: true,
              direction: 'center',
              className: 'district-label'
            });

            layer.on('mouseover', function() {
              layer.setStyle(hoverStyle);
              layer.bringToFront();
            });

            layer.on('mouseout', function() {
              geojsonLayer.resetStyle(layer);
            });

            layer.on('click', function() {
              map.fitBounds(layer.getBounds(), { padding: [30, 30] });
              layer.openPopup();
            });
          }
        }).addTo(map);

        map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
        document.getElementById('status').innerText = `โหลดสำเร็จ: ${districtLayers.length} อำเภอในภาคอีสาน`;
      })
      .catch(error => {
        console.error(error);
        document.getElementById('status').innerText = 'โหลดไฟล์ไม่สำเร็จ: กรุณาวางไฟล์ districts_isan.geojson ไว้โฟลเดอร์เดียวกับ index.html';
      });

    function searchArea() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('status');

      if (!geojsonLayer) return;
      geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));

      if (!keyword) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
        status.innerText = `ทั้งหมด ${districtLayers.length} อำเภอในภาคอีสาน`;
        return;
      }

      const results = districtLayers.filter(item =>
        item.amp.toLowerCase().includes(keyword) ||
        item.province.toLowerCase().includes(keyword)
      );

      if (results.length === 0) {
        status.innerText = 'ไม่พบข้อมูลที่ค้นหา';
        return;
      }

      results.forEach(item => {
        item.layer.setStyle(selectedStyle);
        item.layer.bringToFront();
      });

      const group = L.featureGroup(results.map(item => item.layer));
      map.fitBounds(group.getBounds(), { padding: [40, 40] });
      status.innerText = `พบ ${results.length} รายการ`;
    }

    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchArea();
    });
  </script>
</body>
</html>
