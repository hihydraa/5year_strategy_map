<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผนที่ Hub 8 จุด รัศมี 80 กม.</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: white;
      width: 285px;
      max-width: calc(100vw - 30px);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.2);
    }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .note {
      font-size: 12px;
      color: #374151;
      line-height: 1.5;
    }

    .hub-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .color-box {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
      font-size: 13px;
    }

    .actions a {
      cursor: pointer;
      color: #2563eb;
      text-decoration: underline;
      user-select: none;
    }

    .hub-label {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 2px 6px;
      font-weight: 900;
      font-size: 14px;
      color: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }

    .district-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    
      color: #000 !important;
    
      font-size: 9px !important;   /* ปรับขนาดตรงนี้ */
      font-weight: 500 !important;
    
      text-shadow:
        2px 2px 3px white,
        -2px -2px 3px white,
        2px -2px 3px white,
        -2px 2px 3px white;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #4b5563;
      background: #f3f4f6;
      padding: 6px 7px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>แผนที่ Hub 8 จุด</h2>
    <div class="note">
      รัศมีแต่ละจุด: <b>80 กม.</b><br>
      วงกลม Hub โปร่งแสง: <b>5%</b><br>
    </div>

    <div class="actions">
      <a onclick="selectAll()">เลือกทั้งหมด</a>
      <a onclick="clearAll()">ยกเลิกทั้งหมด</a>
      <a onclick="fitSelectedHubs()">โฟกัส Hub ที่เลือก</a>
    </div>

    <div id="hubList"></div>
    <div id="status">กำลังโหลดข้อมูล...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map', {
      zoomControl: true,
      preferCanvas: true
    }).setView([16.5, 103.3], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusEl = document.getElementById('status');

    const districtStyle = {
      color: '#475569',
      opacity: 0.15,
      weight: 0.6,
      fillColor: '#f59e0b',
      fillOpacity: 0.10
    };

    let districtLayer = null;

    fetch('./districts_isan.geojson')
      .then(res => {
        if (!res.ok) throw new Error('ไม่พบไฟล์ districts_isan.geojson');
        return res.json();
      })
      .then(data => {
        districtLayer = L.geoJSON(data, {
          style: districtStyle,
          onEachFeature: function(feature, layer) {
            const p = feature.properties || {};
            const amp = p.amp_th || p.AMPHOE_T || p.district_th || p.name_th || '';
            const province = p.pro_th || p.PROVINCE_T || p.province_th || '';

          layer.bindTooltip(amp, {
            permanent: true,
            direction: "center",
            className: "district-label"
          });

            layer.bindPopup(`
              <b>อำเภอ${amp}</b><br>
              จังหวัด${province}
            `);
          }
        }).addTo(map);

        districtLayer.bringToBack();
        statusEl.innerText = `โหลดขอบเขตอำเภอสำเร็จ: ${data.features.length} อำเภอ`;
      })
      .catch(error => {
        console.error(error);
        statusEl.innerText = 'โหลด districts_isan.geojson ไม่สำเร็จ กรุณาวางไฟล์ไว้โฟลเดอร์เดียวกับ index.html';
      });

    const hubs = [
      { no: 1, name: 'น้ำพอง', lat: 16.653047418046047, lng: 102.7671336587173, color: '#e11d48' },
      { no: 2, name: 'วานรนิวาส', lat: 17.62922564590057, lng: 103.76765618614859, color: '#f97316' },
      { no: 3, name: 'กุฉินารายณ์', lat: 16.484556499247386, lng: 104.09865659472109, color: '#eab308' },
      { no: 4, name: 'โนนสูง', lat: 15.285010274649796, lng: 102.32297266516949, color: '#65a30d' },
      { no: 5, name: 'เมืองอุดร', lat: 17.351630207013613, lng: 102.8660847089715, color: '#06b6d4' },
      { no: 6, name: 'ยางตลาด', lat: 16.381072982730878, lng: 103.34862348668263, color: '#7c3aed' },
      { no: 7, name: 'มุกดาหาร', lat: 16.435837281203955, lng: 104.61614729696424, color: '#ec4899' },
      { no: 8, name: 'กระนวน', lat: 16.715986533149803, lng: 103.08203023875588, color: '#3b82f6' }
    ];

    const layers = {};

    function createMarkerIcon(hub) {
      return L.divIcon({
        className: '',
        html: `
          <div style="
            background:${hub.color};
            color:white;
            width:30px;
            height:30px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            border:3px solid white;
            box-shadow:0 2px 8px rgba(0,0,0,.35);
          ">
            ${hub.no}
          </div>
        `,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });
    }

    hubs.forEach(hub => {
      const circle = L.circle([hub.lat, hub.lng], {
        radius: 80000,
        color: hub.color,
        opacity: 0.85,
        weight: 2,
        fillColor: hub.color,
        fillOpacity: 0.05
      });

      const marker = L.marker([hub.lat, hub.lng], {
        icon: createMarkerIcon(hub)
      }).bindPopup(`
        <b>Hub ${hub.no}: ${hub.name}</b><br>
        Lat: ${hub.lat}<br>
        Lng: ${hub.lng}<br>
        รัศมี: 80 กม.
      `);

      const label = L.tooltip({
        permanent: true,
        direction: 'bottom',
        offset: [0, 14],
        className: 'hub-label'
      })
      .setLatLng([hub.lat, hub.lng])
      .setContent(hub.name);

      const group = L.layerGroup([circle, marker, label]).addTo(map);
      layers[hub.no] = group;
    });

    const hubList = document.getElementById('hubList');

    hubs.forEach(hub => {
      hubList.innerHTML += `
        <label class="hub-item">
          <input type="checkbox" checked data-hub-no="${hub.no}" onchange="toggleHub(${hub.no}, this.checked)">
          <span class="color-box" style="background:${hub.color}"></span>
          <b>${hub.no}</b>
          <span>${hub.name}</span>
        </label>
      `;
    });

    function toggleHub(no, checked) {
      if (checked) {
        if (!map.hasLayer(layers[no])) layers[no].addTo(map);
      } else {
        if (map.hasLayer(layers[no])) map.removeLayer(layers[no]);
      }
    }

    function selectAll() {
      hubs.forEach(hub => {
        const checkbox = document.querySelector(`#hubList input[data-hub-no="${hub.no}"]`);
        checkbox.checked = true;
        toggleHub(hub.no, true);
      });
      fitSelectedHubs();
    }

    function clearAll() {
      hubs.forEach(hub => {
        const checkbox = document.querySelector(`#hubList input[data-hub-no="${hub.no}"]`);
        checkbox.checked = false;
        toggleHub(hub.no, false);
      });
      statusEl.innerText = 'ยกเลิกการเลือก Hub ทั้งหมดแล้ว';
    }

    function getSelectedHubs() {
      return hubs.filter(hub => map.hasLayer(layers[hub.no]));
    }

    function getSelectedHubBounds() {
      const selectedHubs = getSelectedHubs();
      if (selectedHubs.length === 0) return null;

      const selectedBounds = L.latLngBounds([]);
      selectedHubs.forEach(hub => {
        const center = L.latLng(hub.lat, hub.lng);
        selectedBounds.extend(center.toBounds(160000));
      });
      return selectedBounds;
    }

    function fitSelectedHubs() {
      const selectedBounds = getSelectedHubBounds();
      if (!selectedBounds) {
        alert('กรุณาเลือก Hub อย่างน้อย 1 จุด');
        return;
      }

      map.fitBounds(selectedBounds, {
        padding: [50, 50],
        animate: false
      });

      statusEl.innerText = `โฟกัส Hub ที่เลือก: ${getSelectedHubs().length} จุด`;
    }

    const initialBounds = L.latLngBounds(hubs.map(h => [h.lat, h.lng]));
    map.fitBounds(initialBounds, { padding: [60, 60] });
  </script>
</body>
</html>
